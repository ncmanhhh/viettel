spring:
  application:
    name: Chatbot AI
    code: CHATBOT_AI
    version: @project.version@
    provider: NCMANH

  datasource:
    jdbcUrl: jdbc:postgresql://103.149.28.134:5433/viettel
    username: postgres
    password: manhdb

  datasource-secondary:
    jdbcUrl: localhost:5432/viettel_shop
    username: postgres
    password:

  redis:
    host: localhost
    port: 6379
    database: 0
    username:
    password:


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  elasticsearch:
    uris: http://localhost:9200

  ai:
    embedding:
      provider: gemini
      chunk-size: 700
      overlap-size: 150
    vectorstore:
      pgvector:
        schema: public
        table_name: vector_store
        dimensions: 768
        max-document-batch-size: 10000
    chat:
      last-message-knowledge: 7
      last-message-prompt: 5
      provider: gemini
      vector-top:
        mobile-package: 3
        ftth-package: 3
        sim: 10
      vector-score: 1.7
      vector-index:
        mobile-package: "mobile_packages"
        ftth-package: "ftth_packages"
        sim: "sims"

    vertex:
      ai:
        credentials-uri: classpath:/secret/black-seer-479409-m2-ea6a56a9dd3a.json

        gemini:
          chat:
            options:
              model: gemini-2.5-flash
              max-tokens: 4096
              temperature: 0.7
              tool-names:
                - getMobilePackageAccordingPrice

        embedding:
          project-id: black-seer-479409-m2
          location: asia-southeast1
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiTextCompletionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiTextEditAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
#
scheduled:
  embedding:
    mobile-package:
      active: 1
      time-delay: 10000
#      cron: 0 0/1 * * * ?
      cron: 0 0 2 * * ?
      index: "mobile_packages"
    ftth-package:
      active: 1
      time-delay: 10000
#      cron: 0 0/1 * * * ?
      cron: 0 0 2 * * ?
      index: "ftth_packages"
    sim:
      active: 1
      time-delay: 10000
#      cron: 0 0/1 * * * ?
      cron: 0 0 2 * * ?
      index: "sims"

  sync-data:
    config-to-redis:
      active: 1
      time-delay: 600000
      cron: 0 0/10 * * * ?

integration:
  mock: true
